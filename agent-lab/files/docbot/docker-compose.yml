# The databases DocBot uses in Modules 03–04. Start them all: docker compose up -d
# or one at a time: docker compose up -d pgvector
services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: pw
    ports: ["5432:5432"]
    volumes: ["./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]   # creates the chunks table on first start
  chroma:
    image: chromadb/chroma:1.5.9
    ports: ["8000:8000"]
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["6333:6333"]
